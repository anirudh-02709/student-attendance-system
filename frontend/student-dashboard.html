<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Attendance<span>System</span></div>
      <nav class="topnav" aria-label="Primary navigation">
        <button class="btn secondary" onclick="logout()">Logout</button>
      </nav>
    </header>

    <main class="container">
      <section class="page-header">
        <div>
          <p class="eyebrow">Student</p>
          <h1 data-student-welcome>Welcome</h1>
        </div>
      </section>

      <section class="stats-grid" aria-label="Current semester attendance">
        <article class="card metric-card">
          <p class="metric-label">Attendance %</p>
          <h2 data-student-attendance-percent>0%</h2>
        </article>
        <article class="card metric-card">
          <p class="metric-label">Present Count</p>
          <h2 data-student-present-count>0</h2>
        </article>
        <article class="card metric-card">
          <p class="metric-label">Absent Count</p>
          <h2 data-student-absent-count>0</h2>
        </article>
      </section>

      <section class="card actions-card">
        <h2>Mark Attendance</h2>
        <div class="button-row">
          <button id="markAttendanceBtn" class="btn primary" type="button">
            Mark Attendance
          </button>
        </div>
        <p id="attendanceStatusMessage" class="status-message" hidden></p>
      </section>

      <section class="card table-card">
        <h2>Attendance History</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="studentAttendanceTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="js/auth.js"></script>
    <script>
      requireAuth("STUDENT");
    </script>
    <script src="js/logout.js"></script>
    <script src="js/api.js"></script>
    <script src="js/student-dashboard.js"></script>
  </body>
</html>
